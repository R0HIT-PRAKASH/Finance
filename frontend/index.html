<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Paints the stored theme before the bundle loads, which useTheme cannot do
      // from inside React. Mirrors @heroui/react's useTheme exactly: same storage
      // key, same resolution, same DOM writes. If it disagreed with the hook, the
      // hook would add its class without removing this one and <html> would carry
      // two themes at once. Keep the two in sync.
      try {
        var stored = localStorage.getItem("heroui-theme") || "system";
        var resolved =
          stored === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : stored;
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute("data-theme", resolved);
      } catch {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
